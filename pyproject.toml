[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslibrary"
version = "0.1.0"
description = "A Python chess library that plays by chess.com rules"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
